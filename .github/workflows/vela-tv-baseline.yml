name: Vela TV Launcher V3

on:
  workflow_dispatch:
  push:
    branches: [develop/vela-tv-launcher]
    paths: ['.github/workflows/vela-tv-baseline.yml', '.github/vela-release-cert.sha256', 'launcher/**', 'scripts/**', 'assets/**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and run unit tests
        working-directory: launcher
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Check package and ad-free surface
        shell: bash
        run: |
          set -euo pipefail
          APK=launcher/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -F "package: name='net.velalab.tvlauncher'"
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 scripts/verify_apk_branding.py "$APK"
          ! grep -Eq 'android.permission.INTERNET|com.google.android.gms.ads|com.facebook.ads|applovin|admob' launcher/app/src/main/AndroidManifest.xml launcher/app/build.gradle
          grep -Fq 'android.intent.category.LEANBACK_LAUNCHER' launcher/app/src/main/AndroidManifest.xml
          grep -Fq 'android.intent.category.HOME' launcher/app/src/main/AndroidManifest.xml

  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VELA_RELEASE_KEYSTORE_BASE64: ${{ secrets.VELA_RELEASE_KEYSTORE_BASE64 }}
      VELA_RELEASE_STORE_PASSWORD: ${{ secrets.VELA_RELEASE_STORE_PASSWORD }}
      VELA_RELEASE_KEY_PASSWORD: ${{ secrets.VELA_RELEASE_KEY_PASSWORD }}
      VELA_RELEASE_KEY_ALIAS: ${{ secrets.VELA_RELEASE_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Require approved artwork and permanent signing identity
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/vela-tv-original.png || { echo '::error::Original Vela logo missing'; exit 1; }
          test -s assets/vela-tv-original.sha256 || { echo '::error::Approved logo fingerprint missing'; exit 1; }
          test -s assets/vela-tv-icon-512.png || { echo '::error::Approved Vela icon missing'; exit 1; }
          test -s assets/vela-tv-banner-320x180.png || { echo '::error::Approved Vela banner missing'; exit 1; }
          for key in VELA_RELEASE_KEYSTORE_BASE64 VELA_RELEASE_STORE_PASSWORD VELA_RELEASE_KEY_PASSWORD VELA_RELEASE_KEY_ALIAS; do
            test -n "${!key}" || { echo "::error::Missing release signing secret: $key"; exit 1; }
          done
      - name: Prepare verified original branding
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 scripts/apply_vela_branding.py
          git diff --exit-code -- launcher/app/src/main
      - name: Decode existing keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vela-signing"
          chmod 700 "$RUNNER_TEMP/vela-signing"
          printf '%s' "$VELA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vela-signing/vela-release.jks"
          chmod 600 "$RUNNER_TEMP/vela-signing/vela-release.jks"
          test -s "$RUNNER_TEMP/vela-signing/vela-release.jks"
          echo "VELA_RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/vela-signing/vela-release.jks" >> "$GITHUB_ENV"
          echo "VELA_RELEASE_VERSION_CODE=$((30000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Verify keystore alias and established certificate before build
        shell: bash
        run: |
          set -euo pipefail
          keytool -list -v -keystore "$VELA_RELEASE_KEYSTORE_FILE" \
            -storepass:env VELA_RELEASE_STORE_PASSWORD \
            -alias "$VELA_RELEASE_KEY_ALIAS" > "$RUNNER_TEMP/vela-signing/certificate.txt"
          EXPECTED="$(tr -d '\r\n ' < .github/vela-release-cert.sha256)"
          ACTUAL="$(sed -n 's/^[[:space:]]*SHA256: //p' "$RUNNER_TEMP/vela-signing/certificate.txt" | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL" = "$EXPECTED" || { echo '::error::Keystore certificate is not the established VelaLab identity'; exit 1; }
          echo 'Existing VelaLab signing certificate verified'
      - name: Build signed release
        working-directory: launcher
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease "-PvelaVersionCode=$VELA_RELEASE_VERSION_CODE"
      - name: Verify package, artwork, signature, and version
        shell: bash
        run: |
          set -euo pipefail
          APK=launcher/app/build/outputs/apk/release/app-release.apk
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -s "$APK"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          grep -Fq "package: name='net.velalab.tvlauncher'" "$RUNNER_TEMP/badging.txt"
          grep -Fq "versionCode='$VELA_RELEASE_VERSION_CODE'" "$RUNNER_TEMP/badging.txt"
          grep -Fq "versionName='3.0.0'" "$RUNNER_TEMP/badging.txt"
          grep -Fq "application-label:'Vela TV Launcher'" "$RUNNER_TEMP/badging.txt"
          grep -Fq "application-label-th:'Vela TV Launcher'" "$RUNNER_TEMP/badging.txt"
          grep -Fq "application-icon-160:'res/mipmap-anydpi-v26/vela_tv_icon.xml'" "$RUNNER_TEMP/badging.txt"
          python3 scripts/verify_apk_branding.py "$APK"
          "$SIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/signature.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/signature.txt"
          EXPECTED="$(tr -d '\r\n ' < .github/vela-release-cert.sha256)"
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/signature.txt" | head -n 1)"
          test "$ACTUAL" = "$EXPECTED" || { echo '::error::Unexpected release signing certificate'; exit 1; }
          sha256sum "$APK"
          cp "$APK" Vela-TV-Launcher-V3-Release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Vela-TV-Launcher-V3-Release
          path: Vela-TV-Launcher-V3-Release.apk
          if-no-files-found: error
          retention-days: 90
      - name: Remove temporary keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/vela-signing"
