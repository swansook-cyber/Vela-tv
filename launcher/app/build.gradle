plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId 'net.velalab.tvlauncher'
        minSdk 26
        targetSdk 34
        versionCode providers.gradleProperty('velaVersionCode').map { it.toInteger() }.getOrElse(31000)
        versionName '3.1.0'
    }

    signingConfigs {
        velaRelease {
            def keyFile = System.getenv('VELA_RELEASE_KEYSTORE_FILE')
            if (keyFile) storeFile file(keyFile)
            storePassword System.getenv('VELA_RELEASE_STORE_PASSWORD')
            keyAlias System.getenv('VELA_RELEASE_KEY_ALIAS')
            keyPassword System.getenv('VELA_RELEASE_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.velaRelease
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name == 'assembleRelease' }) {
        def required = ['VELA_RELEASE_KEYSTORE_FILE', 'VELA_RELEASE_STORE_PASSWORD',
                        'VELA_RELEASE_KEY_ALIAS', 'VELA_RELEASE_KEY_PASSWORD']
        if (required.any { !System.getenv(it) }) {
            throw new GradleException('Release signing identity is required; no debug signing fallback')
        }
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
