name: Vela TV Launcher V2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - develop/vela-tv-launcher
    paths:
      - '.github/workflows/vela-tv-baseline.yml'
      - 'scripts/apply_vela_branding.py'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Vela TV branch
        uses: actions/checkout@v4
      - name: Checkout pinned CleanYourTV source
        uses: actions/checkout@v4
        with:
          repository: Gathin23/cleanyourtv
          ref: 0c0f69c3f1a50582bedc5569d4536367611ae9ff
          path: upstream
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses on runner
        shell: bash
        run: |
          set -e
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          sdk_status=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$sdk_status" -ne 0 ]; then exit "$sdk_status"; fi
      - name: Install Android SDK 34
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: Apply Vela TV branding overlay
        run: python3 scripts/apply_vela_branding.py
      - name: Build isolated Vela-package debug APK
        working-directory: upstream/launcher
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest -PlauncherApplicationId=net.velalab.tvlauncher
      - name: Verify debug APK identity and TCL-compatible SDK
        working-directory: upstream/launcher
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="${ANDROID_HOME}/build-tools/34.0.0/aapt"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" > apk-badging.txt
          grep -Fq "package: name='net.velalab.tvlauncher'" apk-badging.txt
          grep -Fq "application-label:'Vela TV Launcher'" apk-badging.txt
          grep -Fq "application-label-th:'Vela TV Launcher'" apk-badging.txt
          grep -Fq "sdkVersion:'26'" apk-badging.txt
          test -f app/src/main/res/drawable/vela_tv_banner.xml
          grep -Fq 'android:banner="@drawable/vela_tv_banner"' app/src/main/AndroidManifest.xml
          grep -Fq 'android.intent.category.LEANBACK_LAUNCHER' app/src/main/AndroidManifest.xml
          grep -Fq 'android.intent.category.HOME' app/src/main/AndroidManifest.xml

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: vela-tv-launcher-v2-debug
          path: upstream/launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Signed release APK (existing VelaLab key)
    if: ${{ vars.VELA_TV_RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VELA_RELEASE_KEYSTORE_BASE64: ${{ secrets.VELA_RELEASE_KEYSTORE_BASE64 }}
      VELA_RELEASE_STORE_PASSWORD: ${{ secrets.VELA_RELEASE_STORE_PASSWORD }}
      VELA_RELEASE_KEY_PASSWORD: ${{ secrets.VELA_RELEASE_KEY_PASSWORD }}
      VELA_RELEASE_KEY_ALIAS: ${{ secrets.VELA_RELEASE_KEY_ALIAS }}
    steps:
      - name: Require permanent release signing secrets
        shell: bash
        run: |
          set -euo pipefail
          for key in VELA_RELEASE_KEYSTORE_BASE64 VELA_RELEASE_STORE_PASSWORD VELA_RELEASE_KEY_PASSWORD VELA_RELEASE_KEY_ALIAS; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing release signing secret: $key"
              exit 1
            fi
          done
      - name: Checkout Vela development branch
        uses: actions/checkout@v4
      - name: Checkout pinned CleanYourTV source
        uses: actions/checkout@v4
        with:
          repository: Gathin23/cleanyourtv
          ref: 0c0f69c3f1a50582bedc5569d4536367611ae9ff
          path: upstream
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses and install SDK 34
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses
          code=${PIPESTATUS[1]}
          set -o pipefail
          test "$code" -eq 0
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: Apply existing Vela branding
        run: python3 scripts/apply_vela_branding.py
      - name: Configure release-only signing and increasing version code
        shell: bash
        env:
          VELA_RELEASE_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          export VELA_RELEASE_VERSION_CODE="$((10000 + VELA_RELEASE_VERSION_CODE))"
          echo "VELA_RELEASE_VERSION_CODE=$VELA_RELEASE_VERSION_CODE" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("upstream/launcher/app/build.gradle")
          source = path.read_text()
          assert source.count("versionCode 8") == 1
          source = source.replace("versionCode 8", "versionCode Integer.parseInt(System.getenv('VELA_RELEASE_VERSION_CODE'))")
          assert source.count("versionName '2.7'") == 1
          source = source.replace("versionName '2.7'", "versionName '2.7.' + System.getenv('VELA_RELEASE_VERSION_CODE')")
          assert source.count("    buildTypes {") == 1
          signing = """    signingConfigs {
              velaRelease {
                  storeFile file(System.getenv('VELA_RELEASE_KEYSTORE_FILE'))
                  storePassword System.getenv('VELA_RELEASE_STORE_PASSWORD')
                  keyAlias System.getenv('VELA_RELEASE_KEY_ALIAS')
                  keyPassword System.getenv('VELA_RELEASE_KEY_PASSWORD')
              }
          }

          """
          source = source.replace("    buildTypes {", signing + "    buildTypes {")
          assert source.count("signingConfig signingConfigs.debug") == 1
          source = source.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.velaRelease")
          path.write_text(source)
          PY
      - name: Decode private keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vela-signing"
          chmod 700 "$RUNNER_TEMP/vela-signing"
          printf '%s' "$VELA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vela-signing/vela-tv-release.jks"
          chmod 600 "$RUNNER_TEMP/vela-signing/vela-tv-release.jks"
          test -s "$RUNNER_TEMP/vela-signing/vela-tv-release.jks"
          echo "VELA_RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/vela-signing/vela-tv-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK and unit tests
        working-directory: upstream/launcher
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease -PlauncherApplicationId=net.velalab.tvlauncher
      - name: Verify release signature, identity, and version
        working-directory: upstream/launcher
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/release-badging.txt"
          grep -Fq "package: name='net.velalab.tvlauncher'" "$RUNNER_TEMP/release-badging.txt"
          grep -Fq "versionCode='$VELA_RELEASE_VERSION_CODE'" "$RUNNER_TEMP/release-badging.txt"
          grep -Fq "application-label:'Vela TV Launcher'" "$RUNNER_TEMP/release-badging.txt"
          grep -Fq "sdkVersion:'26'" "$RUNNER_TEMP/release-badging.txt"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/release-signature.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/release-signature.txt"
          grep -E 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/release-signature.txt"
          sha256sum "$APK"
      - name: Require established VelaLab certificate
        working-directory: upstream/launcher
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          EXPECTED="965f96aeca629a3ea78f439d4fd5fe3bbee53844ff8f445b7fc068b9d85f2dbe"
          ACTUAL="$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Release signer does not match the established VelaLab signing certificate"
            exit 1
          fi

      - name: Publish signed release test artifact
        uses: actions/upload-artifact@v4
        with:
          name: vela-tv-launcher-signed-release
          path: upstream/launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary private keystore
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/vela-signing"
